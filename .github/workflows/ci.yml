name: Tests
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      chromatic-vitest-version:
        description: 'Version of "@chromatic-com/vitest" to install (npm version/tag or pkg.pr.new URL). Leave empty to use package.json.'
        required: false
        default: ''

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Install dependencies
        run: pnpm i

      - name: Install @chromatic-com/vitest@${{ inputs.chromatic-vitest-version }}
        if: ${{ inputs.chromatic-vitest-version != '' }}
        env:
          VERSION: ${{ inputs.chromatic-vitest-version }}
        run: |
          if [[ "$VERSION" == *"://"* ]]; then
            pnpm add -D "$VERSION"
          else
            pnpm add -D "@chromatic-com/vitest@$VERSION"
          fi
          pnpm ls @chromatic-com/vitest

      - name: Run tests
        run: pnpm run test --reporter=blob --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Debugs
        continue-on-error: true
        run: |
          ls -la
          ls -la .vitest*
          cd .vitest
          tree
          cat chromatic/preview-stats*

      - name: Upload .vitest to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-archives-${{ matrix.shard }}
          path: .vitest/*
          include-hidden-files: true
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [tests]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Install dependencies
        run: pnpm i

      - name: Install @chromatic-com/vitest@${{ inputs.chromatic-vitest-version }}
        if: ${{ inputs.chromatic-vitest-version != '' }}
        env:
          VERSION: ${{ inputs.chromatic-vitest-version }}
        run: |
          if [[ "$VERSION" == *"://"* ]]; then
            pnpm add -D "$VERSION"
          else
            pnpm add -D "@chromatic-com/vitest@$VERSION"
          fi
          pnpm ls @chromatic-com/vitest

      - name: Download .vitest archives from GitHub Actions Artifacts
        uses: actions/download-artifact@v4
        with:
          path: .vitest
          pattern: vitest-archives-*
          merge-multiple: true

      - name: Debugs
        continue-on-error: true
        run: |
          ls -la
          ls -la .vitest*
          cd .vitest
          tree
          cat chromatic/preview-stats*

      - name: Merge reports
        run: npx vitest --merge-reports

      - name: Debugs after merge
        continue-on-error: true
        run: |
          ls -la
          ls -la .vitest*
          cd .vitest
          tree
          cat chromatic/preview-stats*

      - name: Run Chromatic tests
        uses: chromaui/action@latest
        with:
          vitest: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
